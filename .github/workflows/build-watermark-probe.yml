name: Build BiliTV watermark GPU probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/libmpv-watermark

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build GPU probe APK
        run: |
          flutter build apk --debug --dart-define=MPV_GPU_PROBE=true
          mkdir -p build/watermark-artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk build/watermark-artifacts/BiliTV-watermark-gpu-probe.apk

      - name: Build normal research APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk build/watermark-artifacts/BiliTV-watermark-player.apk

      - name: Upload GPU probe APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliTV-watermark-gpu-probe
          path: build/watermark-artifacts
          if-no-files-found: error
